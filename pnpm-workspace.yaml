# Private build units; packages/app remains the only published package.
packages:
  - packages/*
  - apps/*
# Reviewed against this repository's npm lockfile, including Electron 35.
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - es5-ext
  - esbuild
  - fsevents
  - node-pty
  - protobufjs
# Carry the frozen baseline's fast-uri security pin into every build unit.
overrides:
  fast-uri: 4.1.2

# Frozen upstream fix: certificate export and temporary keychain passwords differ.
patchedDependencies:
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch

# Plain npm-compatible specs resolve private bundled workspace packages locally.
linkWorkspacePackages: true
